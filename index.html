<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicathon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav class="nav1">
            <img height="70px" width="160px" src="./logo.png"/>
            <div class="navright">
                <p>Home</p>
                <p>Products</p>
                <p>Contacts</p>
                <button class="tbut">
                    Place order
                    <img height="20px" width="20px" src="placeOrder.svg"/>
                </button>
            </div>
        </nav>
        <div class="nav2">
            <div class="but1">
                <button>Products</button>
            </div>
            <div class="but2">
                <button>Custom</button>
            </div>
        </div>
        <div class="Middle">
            <div class="midleft">
                <h2>FIND YOUR GREATNESS</h2>
                <br>
                <p>Built for speed and confidence,<br>every pair combines premium<br>materials and bold design.<br>Engineered for comfort made for<br>movement.</p>
            </div>
            <div class="midcenter">
                <h3 class="hype">HYPE</h3>
                <div class="image">
                    <img height="100px" width="100px" src="./shoe.png"/>
                </div>
            </div>
            <div class="midright">
                <p>Choose your color</p>
                <br>
                <button class="c1"></button>
                <button class="c2"></button>
                <button class="c3"></button>
                <br>
                <br>
                <button class="d1">40</button>
                <button class="d2">42</button>
                <button class="d3">44</button>
            </div>
        </div>
        <div class="bottom">
            <div class="left">
                <img height="20px" width="20px" src="./instagram.svg"/>
                <img height="20px" width="20px" src="./facebook.svg"/>
                <img height="20px" width="20px" src="./pinterest.svg"/>
                <img height="20px" width="20px" src="./youtube.svg"/>
            </div>
            <div class="middle">
                <span></span>
                <p>SNEAKERS FOR MORE</p>
                <span></span>
            </div>
            <div class="right">
                <button class="tbut">
                    See all products
                    <img height="20px" width="20px" src="./arrow.svg"/>
                </button>
            </div>
        </div>
    </main>
</body>
</html>
